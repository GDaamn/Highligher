[project]
name = "replica-document-engine"
version = "0.1.0"
description = "Convert PDF, EPUB, and extensible document formats into editable Replica scenes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "pillow>=11,<12",
  "pdfplumber>=0.11,<1",
  "pypdf>=5,<7",
]

keywords = ["pdf", "epub", "ocr", "layout", "editable", "converter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
replica-convert = "replica.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replica"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/replica",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
