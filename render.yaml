services:
  - type: web
    name: booklamp
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: library
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HIGHLIGHTER_DATA_DIR
        value: /var/data/booklamp
      - key: FOCUS_PROVIDER
        value: heuristic
